name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  maven-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'oracle'

      - name: Find service directory
        run: |
          SERVICE_DIR=$(find . -maxdepth 1 -type d -name "*-service" | head -1 | sed 's|./||')
          echo "SERVICE_DIR=$SERVICE_DIR" >> $GITHUB_ENV
      - name: Get version and artifact
        id: meta
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
          echo "artifact=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_OUTPUT
          
      - name: Build with Maven and Upload to Github Packages
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ${{ env.SERVICE_DIR }}/target/*.jar

  docker-build:
    runs-on: ubuntu-latest
    needs: maven-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact
          path: ${{ needs.maven-build.outputs.artifact }}/target/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ needs.maven-build.outputs.artifact }}:${{ needs.maven-build.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ needs.maven-build.outputs.artifact }}:latest
